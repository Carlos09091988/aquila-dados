name: Vince - sonda de fontes
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo "== resumo"; curl -sL -m 120 -r 0-5000 https://sites.tcu.gov.br/dados-abertos/jurisprudencia/arquivos/acordao-completo/acordao-completo-resumo.csv | head -c 5000; echo
          echo "== boletim"; curl -sL -m 120 -r 0-2500 https://sites.tcu.gov.br/dados-abertos/jurisprudencia/arquivos/boletim-jurisprudencia/boletim-jurisprudencia.csv | head -c 2500; echo
          echo "== normas js"
          curl -sL -m 60 'https://normas.leg.br/?urn=urn:lex:br:federal:lei:2021-04-01;14133' | grep -oE 'src="[^"]+\.js"' | head
          for js in $(curl -sL -m 60 'https://normas.leg.br/' | grep -oE 'src="main[^"]*\.js"' | sed 's/src="//;s/"//'); do curl -sL -m 60 "https://normas.leg.br/$js" | grep -oE '"[^"]*api[^"]*"' | sort -u | head -30; done
          for u in 'https://normas.leg.br/api/normas?urn=urn:lex:br:federal:lei:2021-04-01;14133&tipo_documento=maior-detalhe' 'https://normas.leg.br/api/normas?urn=urn:lex:br:federal:lei:2021-04-01;14133'; do echo "-- $u"; curl -sL -m 60 -o /tmp/p -w "%{http_code} %{size_download} %{content_type}\n" "$u"; head -c 1500 /tmp/p; echo; done
