name: Aquila - STJ licitacoes
on:
  schedule:
    - cron: '13 10 6 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stj.py && git pull -q --rebase || true; python3 scripts/outras_fontes.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git pull -q --rebase || true
          git add aquila/jur && (git diff --cached --quiet || (git commit -m "STJ: atualizacao" && (for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*7)); done; exit 1)))
