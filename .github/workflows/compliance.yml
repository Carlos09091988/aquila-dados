name: Desenvolve - compliance (trabalho escravo e embargos)
on:
  schedule:
    - cron: '37 8 * * 1'   # toda segunda, 05:37 em Brasilia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 scripts/compliance.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/compliance && (git diff --cached --quiet || (git commit -q -m "Compliance: trabalho escravo e embargos" && (for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*7)); done; exit 1)))
