name: Vince - sonda de fontes
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          curl -sL -m 120 -o l.json 'https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:2021-04-01;14133&tipo_documento=maior-detalhe'
          python3 - <<'PY'
          import json
          j=json.load(open('l.json'))
          for e in j['encoding']: print('ENC', e.get('version'), e.get('additionalType'), e.get('encodingFormat'), e.get('contentUrl'), str(e.get('name'))[:80])
          art=j['hasPart']['hasPart'][1]
          print('PART1 keys', list(art.keys()), art.get('legislationIdentifier'))
          def find(o,depth=0):
              if isinstance(o,dict):
                  lid=o.get('legislationIdentifier','')
                  if lid.endswith('!art6') or lid.endswith('!art6_cpt') or lid.endswith('!art75') or '!art75_cpt_inc2' in lid[-20:]:
                      print('NODE', lid, json.dumps(o, ensure_ascii=False)[:1500])
                  for v in o.values(): find(v,depth+1)
              elif isinstance(o,list):
                  for v in o: find(v,depth+1)
          find(j)
          PY
