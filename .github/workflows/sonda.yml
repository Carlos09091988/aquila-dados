name: Sonda de APIs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > sonda.txt 2>&1
          curl -s -m 60 https://dadosabertos.compras.gov.br/v3/api-docs -o docs.json
          python3 - <<'PY'
          import json
          d=json.load(open('docs.json'))
          for p,v in d['paths'].items():
              if any(k in p for k in ['pesquisa-preco','modulo-material','modulo-servico']):
                  for m,o in v.items():
                      print(p, '|', ', '.join(x['name']+('*' if x.get('required') else '') for x in o.get('parameters',[])))
          PY
          p(){ echo "=== $1"; curl -s -m 60 -A "Mozilla/5.0" "$1" | head -c 900; echo; }
          p "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/1_consultarMaterial?pagina=1&tamanhoPagina=10&tipo=M&codigo=150486"
          p "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/2_consultarMaterialDetalhe?pagina=1&tamanhoPagina=10&codigoItemCatalogo=150486"
          p "https://dadosabertos.compras.gov.br/modulo-material/4_consultarItemMaterial?pagina=1&tamanhoPagina=500&statusItem=true"
          p "https://dadosabertos.compras.gov.br/modulo-material/4_consultarItemMaterial?pagina=1&tamanhoPagina=10&descricaoItem=PAPEL%20A4"
          p "https://dadosabertos.compras.gov.br/modulo-servico/6_consultarItemServico?pagina=1&tamanhoPagina=500&statusServico=true"
          curl -s -m 60 "https://dadosabertos.compras.gov.br/modulo-material/4_consultarItemMaterial?pagina=1&tamanhoPagina=500&statusItem=true" | python3 -c "import json,sys;d=json.load(sys.stdin);print('MAT total',d.get('totalRegistros'),'pags',d.get('totalPaginas'),'n',len(d.get('resultado',[])));print(json.dumps(d['resultado'][0],ensure_ascii=False)[:600])"
          curl -s -m 60 "https://dadosabertos.compras.gov.br/modulo-servico/6_consultarItemServico?pagina=1&tamanhoPagina=500&statusServico=true" | python3 -c "import json,sys;d=json.load(sys.stdin);print('SERV total',d.get('totalRegistros'),'pags',d.get('totalPaginas'),'n',len(d.get('resultado',[])));print(json.dumps(d['resultado'][0],ensure_ascii=False)[:600])"
          curl -s -m 60 "https://dadosabertos.compras.gov.br/modulo-pesquisa-preco/3_consultarServico?pagina=1&tamanhoPagina=500&codigoItemCatalogo=23477&dataCompraInicio=2025-10-01" | python3 -c "import json,sys;d=json.load(sys.stdin);print('PRECO total',d.get('totalRegistros'),'pags',d.get('totalPaginas'),'n',len(d.get('resultado',[])))"
      - run: |
          git config user.name robo-aquila; git config user.email robo@aquilaadvocacia.com.br
          git checkout -B sonda && git add -f sonda.txt && git commit -qm sonda && git push -f origin sonda
