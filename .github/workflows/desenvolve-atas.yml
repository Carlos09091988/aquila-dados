name: Desenvolve - robo das atas (participantes)
on:
  schedule:
    - cron: '41 9 * * *'   # todo dia, 06:41 em Brasilia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atas:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: LIMITE_SEG=2400 python3 scripts/atas_participantes.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/participacoes && (git diff --cached --quiet || (git commit -q -m "Robo das atas: participantes" && (for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*7)); done; exit 1)))
