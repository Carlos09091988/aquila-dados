name: pncp-arquivos
# Baixa os PDFs de uma licitação no PNCP e entrega ao site da Desenvolve.
# O pedido traz só um código sem significado; a licitação é informada pelo site, com a senha combinada.
on:
  workflow_dispatch:
    inputs:
      tk:
        description: pedido
        required: true
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar e entregar
        env:
          TK: ${{ inputs.tk }}
          SEGREDO: ${{ secrets.DV_ROBO_SEGREDO }}
        run: |
          python3 - <<'PY'
          import os, json, base64, io, zipfile, urllib.request, urllib.parse
          SITE = 'https://desenvolveestrategias.com.br/wp-json/desenvolve/v1/'
          TK, SEG = os.environ['TK'], os.environ['SEGREDO']
          def site(path, data=None):
              req = urllib.request.Request(SITE + path, data=json.dumps(data).encode() if data is not None else None,
                  headers={'X-Robo': SEG, 'Content-Type': 'application/json', 'User-Agent': 'desenvolve-robo'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read() or b'{}')
          def get(url, limite=None):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': '*/*'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read(limite) if limite else r.read()
          try:
              ref = site('robo/pedido?tk=' + urllib.parse.quote(TK))['ref']
              c, a, s = ref.split('/')
              lista = json.loads(get(f'https://pncp.gov.br/api/pncp/v1/orgaos/{c}/compras/{a}/{s}/arquivos'))
              lista = [x for x in lista if x.get('url') and x.get('statusAtivo', True)]
              def pr(x):
                  t = ((x.get('tipoDocumentoNome') or '') + ' ' + (x.get('titulo') or '')).lower()
                  return 0 if 'edital' in t else 1 if ('termo de refer' in t or 'projeto b' in t) else 3 if ('minuta' in t or 'contrato' in t) else 2
              lista.sort(key=pr)
              out, tot = [], 0
              for x in lista:
                  if len(out) >= 4 or tot > 22 * 1048576:
                      break
                  try:
                      b = get(x['url'], 26 * 1048576)
                  except Exception:
                      continue
                  pdfs = []
                  if b[:4] == b'%PDF':
                      pdfs.append(((x.get('titulo') or 'arquivo') + '.pdf', b))
                  elif b[:2] == b'PK':
                      try:
                          z = zipfile.ZipFile(io.BytesIO(b))
                          for n in z.namelist():
                              if n.lower().endswith('.pdf'):
                                  pdfs.append((n.split('/')[-1], z.read(n)))
                      except Exception:
                          pass
                  for nome, d in pdfs:
                      if len(out) >= 4 or tot + len(d) > 25 * 1048576:
                          break
                      out.append({'nome': nome[:120], 'data': base64.b64encode(d).decode()}); tot += len(d)
              r = site('robo/entrega', {'tk': TK, 'arquivos': out})
              print('entregues:', r.get('n'))
          except Exception as e:
              print('falhou:', type(e).__name__)
              try:
                  site('robo/falha', {'tk': TK})
              except Exception:
                  pass
          PY
