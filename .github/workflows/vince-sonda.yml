name: Vince - sonda de fontes
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          echo "== lista TCU"; curl -sL -m 60 https://sites.tcu.gov.br/dados-abertos/jurisprudencia/arquivos/jurisprudencia-arquivos.csv | head -80
          echo "== planalto"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in 'https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14133.htm' 'http://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/L14133.htm' 'https://www.planalto.gov.br/ccivil_03/leis/l9784.htm' 'https://normas.leg.br/?urn=urn:lex:br:federal:lei:2021-04-01;14133' 'https://www.lexml.gov.br/urn/urn:lex:br:federal:lei:2021-04-01;14133'; do echo "-- $u"; curl -sL -m 60 -A "$UA" -o /tmp/p -w "%{http_code} %{size_download} %{url_effective}\n" "$u" || echo falhou; head -c 300 /tmp/p | tr '\n' ' '; echo; done
