<div class="ds" id="ds">
<form class="ds-f" autocomplete="off"><label for="ds-c">CNPJ da empresa</label><div class="ds-r"><input id="ds-c" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18"><button type="submit" data-n>Gerar dossiê completo</button></div><p class="ds-h">Reúne cadastro, sócios, grupo econômico, dívida ativa e solidários, sanções, contratos públicos, publicações em diários oficiais e notícias. Usa <b class="ds-cr">3</b> créditos; abrir de novo o mesmo dossiê em 30 dias não cobra.</p><p class="ds-m"></p></form>
<div class="ds-out"></div>
</div>
<style>
.ds{--ln:#E3DED2;--mu:#6E6A60;--gd:#A8843F;--ink:#16191E;color:var(--ink);font-family:"Hanken Grotesk",-apple-system,sans-serif;padding:28px}
.ds-f label{font-weight:700;display:block;margin-bottom:8px}.ds-r{display:flex;gap:10px}.ds-r input{flex:1;border:1px solid #CFC8B8;border-radius:10px;padding:13px 14px;font:inherit;background:#fff;font-size:1.05rem}
.ds button{background:#C9A45C;color:#241A06;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}.ds button.g{background:#fff;border:1px solid var(--ln);font-weight:600}
.ds-h{color:var(--mu);font-size:.88rem;margin:8px 0 0}.ds-m{font-weight:600;margin:8px 0 0}.ds-m.e{color:#B04A3A}

.rp-hd small{color:#C9A45C;letter-spacing:.2em;font-weight:700;font-size:.72rem}.rp-hd h2{color:#F4F2EC;font-family:"Fraunces",Georgia,serif;font-size:1.8rem;margin:6px 0 4px;line-height:1.15}.rp-hd p{margin:0;color:#B9BDB8;font-size:.9rem}
.rp-bar{display:flex;gap:8px;padding:12px 30px;border-bottom:1px solid var(--ln);background:#FAF8F3;flex-wrap:wrap}
.rp-sec{padding:24px 30px;border-bottom:1px solid var(--ln)}.rp-sec h3{margin:0 0 14px;font-size:1.15rem;color:var(--ink);display:flex;align-items:center;gap:10px}.rp-sec h3 i{font-style:normal;color:var(--gd);font-size:.8rem;font-weight:700;letter-spacing:.1em}
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.sem div{border:1px solid var(--ln);border-radius:12px;padding:12px 14px;border-top:4px solid #8FBDA3}.sem div.am{border-top-color:#D9B45A}.sem div.vm{border-top-color:#C8604E}.sem b{display:block;font-size:.8rem;color:var(--mu);font-weight:600}.sem span{font-weight:700;font-size:1rem}
.al{margin:14px 0 0;padding:0;list-style:none}.al li{padding:9px 12px;border-left:4px solid #C8604E;background:#FBF1EE;border-radius:6px;margin-bottom:6px;font-size:.93rem}.al li.am{border-left-color:#D9B45A;background:#FBF6E8}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 22px}.kv div{font-size:.92rem;padding:6px 0;border-bottom:1px dashed #EEE9DE}.kv b{display:block;font-size:.75rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tb{width:100%;border-collapse:collapse;font-size:.88rem}.tb th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);border-bottom:2px solid var(--ln);padding:8px 6px}.tb td{border-bottom:1px solid #EEE9DE;padding:8px 6px;vertical-align:top}
.tbw{overflow-x:auto}.mu{color:var(--mu)}.vm{color:#B04A3A;font-weight:700}.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:#F4EEDF;margin:1px 2px 1px 0}
.nt{border-top:1px solid #EEE9DE;padding:9px 0}.nt a{color:var(--ink);font-weight:600;text-decoration:none}
.rp-ft{padding:18px 30px;color:var(--mu);font-size:.8rem;background:#FAF8F3}
.ld{padding:40px;text-align:center;color:var(--mu)}.ld b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
@media(max-width:700px){.ds{padding:16px}.ds-r{flex-direction:column}.rp-sec,.rp-hd{padding:18px}}

</style>
<script>
(function(){var R=document.getElementById('ds');if(!R||!window.DV)return;var out=R.querySelector('.ds-out'),msg=R.querySelector('.ds-m');
var D=null;
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function m(v){return v==null||v===''?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fc(c){c=String(c||'').replace(/\D/g,'');return c.length===14?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):c}
function br(d){d=String(d||'');var x=d.match(/^(\d{4})-(\d{2})-(\d{2})/);return x?x[3]+'/'+x[2]+'/'+x[1]:d}
function lbl(k){return String(k).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,function(c){return c.toUpperCase()})}
function kv(o,keys){return'<div class="kv">'+keys.filter(function(k){return o[k[0]]!=null&&o[k[0]]!==''}).map(function(k){return'<div><b>'+e(k[1])+'</b>'+(k[2]?k[2](o[k[0]]):e(o[k[0]]))+'</div>'}).join('')+'</div>'}
function tabela(rows,cols){if(!rows||!rows.length)return'<p class="mu">Nada encontrado.</p>';return'<div class="tbw"><table class="tb"><thead><tr>'+cols.map(function(c){return'<th>'+e(c[1])+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr>'+cols.map(function(c){var v=typeof c[0]==='function'?c[0](r):r[c[0]];return'<td>'+(c[2]?v:e(v))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
/* Renderizador genérico para as partes vindas das ferramentas do Raio-X */
function generico(v,prof){prof=prof||0;if(v==null)return'<span class="mu">—</span>';if(typeof v!=='object')return e(typeof v==='number'&&Math.abs(v)>999?v.toLocaleString('pt-BR'):v);
 if(Array.isArray(v)){if(!v.length)return'<span class="mu">Nada encontrado.</span>';if(typeof v[0]!=='object')return e(v.join(', '));var ks=[];v.slice(0,20).forEach(function(r){Object.keys(r||{}).forEach(function(k){if(ks.indexOf(k)<0&&ks.length<8&&(r[k]==null||typeof r[k]!=='object'))ks.push(k)})});
  return'<div class="tbw"><table class="tb"><thead><tr>'+ks.map(function(k){return'<th>'+e(lbl(k))+'</th>'}).join('')+'</tr></thead><tbody>'+v.slice(0,100).map(function(r){return'<tr>'+ks.map(function(k){return'<td>'+generico(r[k],9)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+(v.length>100?'<p class="mu">Mostrando 100 de '+v.length+'.</p>':'')}
 if(prof>2)return'';var H='',esc=[];Object.keys(v).forEach(function(k){var x=v[k];if(/url|link|token|nonce|chave|key/i.test(k)&&typeof x==='string')return;if(x!=null&&typeof x==='object')esc.push(k);else if(x!==''&&x!=null)H+='<div><b>'+e(lbl(k))+'</b>'+generico(x)+'</div>'});
 return(H?'<div class="kv">'+H+'</div>':'')+esc.map(function(k){return'<h4 style="margin:16px 0 8px;font-size:.95rem">'+e(lbl(k))+'</h4>'+generico(v[k],prof+1)}).join('')}
function sec(n,t,body){return'<section class="rp-sec"><h3><i>'+n+'</i>'+e(t)+'</h3>'+body+'</section>'}
function render(d){var c=d.cadastro||{},p=d.pgfn,g=d.grupo||[],nt=d.noticias||{itens:[]},al=[],sm=[];
 var sit=String(c.descricao_situacao_cadastral||'');if(sit&&!/ATIVA/i.test(sit))al.push(['vm','Situação na Receita: '+sit]);
 if(p&&p.total>0){al.push(['vm','Dívida ativa da União: '+m(p.total)+' em '+p.inscricoes+' inscrição(ões)'+(p.ajuizadas?', '+p.ajuizadas+' ajuizada(s)':'')]);}
 if(p&&p.solidarios&&p.solidarios.length)al.push(['vm',p.solidarios.length+' empresa(s) ou pessoa(s) responde(m) solidariamente pelas mesmas inscrições (CTN, arts. 124 e 135)']);
 var gp=g.filter(function(x){return x.pgfn>0});if(gp.length)al.push(['am',gp.length+' empresa(s) do grupo com dívida ativa da União, somando '+m(gp.reduce(function(a,x){return a+x.pgfn},0))]);
 if(nt.itens&&nt.itens.length)al.push(['am',nt.itens.length+' notícia(s) negativa(s) na imprensa nos últimos 3 anos']);
 var ab=c.data_inicio_atividade?new Date(c.data_inicio_atividade):null,anos=ab?(Date.now()-ab)/31557600000:null;if(anos!=null&&anos<2)al.push(['am','Empresa aberta há menos de 2 anos ('+br(c.data_inicio_atividade)+')']);
 sm.push(['Receita Federal',sit||'—',/ATIVA/i.test(sit)?'':'vm']);sm.push(['Dívida ativa da União',p&&p.total>0?m(p.total):'Nada consta',p&&p.total>0?'vm':'']);
 sm.push(['Grupo econômico',g.length+' empresa(s) ligada(s)',gp.length?'am':'']);sm.push(['Imprensa',nt.itens&&nt.itens.length?nt.itens.length+' notícia(s) negativa(s)':'Nada encontrado',nt.itens&&nt.itens.length?'am':'']);
 var H='<div class="rp"><div class="rp-hd"><div><small>DESENVOLVE · DOSSIÊ COMPLETO</small><h2>'+e(c.razao_social)+'</h2><p>CNPJ '+fc(d.cnpj)+(c.nome_fantasia?' · '+e(c.nome_fantasia):'')+' · '+e((c.municipio||'')+'/'+(c.uf||''))+'</p></div><p>Gerado em '+br(d.gerado_em)+' '+String(d.gerado_em||'').slice(11,16)+'<br>Uso exclusivo de '+e(window.DVWM||'')+'</p></div>';
 H+='<div class="rp-bar"><button type="button" class="g" data-pdf>Salvar em PDF</button><button type="button" class="g" data-cons>Acionar um consultor</button></div>';
 H+=sec('01','Resumo executivo','<div class="sem">'+sm.map(function(s){return'<div class="'+s[2]+'"><b>'+e(s[0])+'</b><span>'+e(s[1])+'</span></div>'}).join('')+'</div>'+(al.length?'<ul class="al">'+al.map(function(a){return'<li class="'+a[0]+'">'+e(a[1])+'</li>'}).join('')+'</ul>':'<p style="margin-top:14px">Nenhum ponto de atenção automático encontrado.</p>'));
 H+=sec('02','Cadastro na Receita Federal',kv(c,[['razao_social','Razão social'],['nome_fantasia','Nome fantasia'],['descricao_situacao_cadastral','Situação'],['data_situacao_cadastral','Desde',br],['data_inicio_atividade','Abertura',br],['natureza_juridica','Natureza jurídica'],['porte','Porte'],['capital_social','Capital social',m],['cnae_fiscal_descricao','Atividade principal'],['opcao_pelo_simples','Simples Nacional',function(v){return v?'Sim':'Não'}],['logradouro','Endereço',function(){return e([c.descricao_tipo_de_logradouro,c.logradouro,c.numero,c.complemento,c.bairro,(c.municipio||'')+'/'+(c.uf||''),c.cep].filter(Boolean).join(', '))}],['ddd_telefone_1','Telefone'],['email','E-mail']])+(c.cnaes_secundarios&&c.cnaes_secundarios.length?'<h4 style="margin:16px 0 6px;font-size:.95rem">Atividades secundárias</h4><p class="mu" style="font-size:.88rem">'+c.cnaes_secundarios.slice(0,30).map(function(x){return e(x.descricao)}).join(' · ')+'</p>':''));
 H+=sec('03','Sócios e administradores',tabela(c.qsa||[],[['nome_socio','Nome'],['qualificacao_socio','Qualificação'],['cnpj_cpf_do_socio','Documento'],[function(r){return br(r.data_entrada_sociedade)},'Entrada'],['faixa_etaria','Faixa etária']]));
 H+=sec('04','Grupo econômico e vínculos','<p class="mu" style="margin-top:0">Empresas ligadas por sócio em comum, participação societária, mesmo telefone, e-mail ou endereço (base da Receita Federal'+(d.meta&&d.meta.socios?', '+e(d.meta.socios.referencia):'')+').</p>'+tabela(g,[[function(r){return'<b>'+e(r.razao)+'</b><br><span class="mu">'+fc(r.cnpj)+'</span>'},'Empresa',1],[function(r){return r.vias.map(function(v){return'<span class="tag">'+e(v)+'</span>'}).join(' ')},'Ligação',1],[function(r){return r.pgfn>0?'<span class="vm">'+m(r.pgfn)+'</span>':'<span class="mu">Nada consta</span>'},'Dívida ativa (União)',1]])+(d.parentes&&d.parentes.length?'<h4 style="margin:18px 0 8px;font-size:.95rem">Possíveis parentes de sócios em outras empresas (mesmo sobrenome raro)</h4>'+tabela(d.parentes,[['socio','Sócio'],['pessoa','Pessoa'],['qualificacao','Qualificação'],[function(r){return e(r.empresa)+'<br><span class="mu">'+fc(r.cnpj)+'</span>'},'Empresa',1]])+'<p class="mu" style="font-size:.8rem">Sobrenome igual não prova parentesco; é um indício para checagem.</p>':''));
 H+=sec('05','Dívida ativa da União (PGFN)',p?kv(p,[['total','Total inscrito',m],['em_cobranca','Em cobrança',m],['previdenciaria','Previdenciária',m],['nao_previdenciaria','Não previdenciária',m],['fgts','FGTS',m],['inscricoes','Inscrições'],['ajuizadas','Ajuizadas'],['tipos','Situações']])+(p.solidarios&&p.solidarios.length?'<h4 style="margin:18px 0 8px;font-size:.95rem">Empresas e pessoas solidárias ou corresponsáveis nas mesmas inscrições</h4>'+tabela(p.solidarios,[['nome','Nome'],[function(r){return fc(r.doc)},'Documento'],['tipo','Tipo de responsabilidade'],[function(r){return m(r.valor)},'Valor das inscrições'],['inscricoes','Inscrições']]):''):'<p>Nada consta na base de devedores da PGFN'+(d.meta&&d.meta.pgfn?' ('+e(d.meta.pgfn.referencia)+')':'')+'.</p>');
 H+=sec('06','Sanções, certidões e situação nos órgãos de controle',generico(d.raiox)+(d.extras?generico(d.extras):''));
 H+=sec('07','Contratos e pagamentos públicos',generico(d.federal));
 H+=sec('08','Publicações em diários oficiais',generico(d.diarios));
 H+=sec('09','Notícias negativas na imprensa',nt.itens&&nt.itens.length?nt.itens.map(function(i){return'<div class="nt"><div class="mu" style="font-size:.8rem">'+br(i.data)+' · '+e(i.fonte||'')+' · '+i.riscos.map(e).join(', ')+'</div><a href="'+e(i.url)+'" target="_blank" rel="noopener">'+e(i.titulo)+'</a></div>'}).join('')+'<p class="mu" style="font-size:.8rem;margin-top:10px">Localizadas automaticamente pelo nome '+e((nt.termos||[]).join(' / '))+'. Podem tratar de outra empresa com nome parecido; abra a matéria e confira.</p>':'<p>'+e(nt.aviso||'Nenhuma notícia negativa encontrada nos últimos 3 anos.')+'</p>');
 H+='<div class="rp-ft">Dossiê gerado automaticamente pela plataforma Desenvolve a partir de bases públicas oficiais (Receita Federal, PGFN, CGU/Portal da Transparência, TCU, PNCP, Querido Diário) e da imprensa. Bases com atualização periódica podem não refletir a situação do dia. Não constitui parecer jurídico; confira certidões e documentos oficiais antes de decidir. Uso exclusivo de '+e(window.DVWM||'')+', vedada a redistribuição.</div></div>';
 out.innerHTML=H;
 out.querySelector('[data-pdf]').onclick=function(){window.print()};
 out.querySelector('[data-cons]').onclick=function(){var b=document.querySelector('.dv-cons button');if(b)b.click()};
 var cons=document.querySelector('.dv-cons');if(cons)cons.classList.add('on')}
var cr=(window.DV&&DV.cr_dossie)||3;R.querySelector('.ds-cr').textContent=cr;
R.querySelector('.ds-f').addEventListener('submit',function(ev){ev.preventDefault();var c=R.querySelector('#ds-c').value.replace(/\D/g,'');msg.className='ds-m';msg.textContent='';if(c.length!==14){msg.className='ds-m e';msg.textContent='Digite um CNPJ com 14 números.';return}
 var b=R.querySelector('[data-n]');b.disabled=true;out.innerHTML='<div class="ld"><b>Montando o dossiê…</b>Consultando Receita, PGFN, grupo econômico, órgãos de controle, contratos, diários oficiais e imprensa. Pode levar até 1 minuto.</div>';
 fetch(DV.api+'dossie',{method:'POST',credentials:'same-origin',headers:{'X-WP-Nonce':DV.nonce,'Content-Type':'application/json'},body:JSON.stringify({cnpj:c})}).then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})}).then(function(x){b.disabled=false;if(x.s>=400){out.innerHTML='';msg.className='ds-m e';msg.innerHTML=e(x.j.message||'Erro.')+(x.s===402?' <a href="'+(DV.acesso?'/creditos/':'/assinar/')+'">'+(DV.acesso?'Comprar créditos':'Assinar')+'</a>':'');return}
  D=x.j;render(D);var s=document.getElementById('dv-saldo');if(s&&D.saldo&&!DV.master)s.textContent='Créditos: '+D.saldo.total;history.replaceState(null,'','?cnpj='+c)}).catch(function(){b.disabled=false;out.innerHTML='';msg.className='ds-m e';msg.textContent='Não foi possível montar o dossiê agora. Tente de novo.'})},true);
var q=location.search.match(/cnpj=(\d{14})/);if(q)R.querySelector('#ds-c').value=fc(q[1]);
})();
</script>
