name: Vince - sonda de fontes
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          curl -sL -m 120 -o l.json 'https://normas.leg.br/api/public/normas?urn=urn:lex:br:federal:lei:1999-01-29;9784&tipo_documento=maior-detalhe'
          python3 - <<'PY'
          import json
          j=json.load(open('l.json'))
          print('TOP', list(j.keys())); hp=j.get('hasPart'); print('hasPart type', type(hp).__name__)
          for e in j.get('encoding',[]): print('ENC', e.get('version'), e.get('additionalType'), e.get('encodingFormat'), e.get('contentUrl'))
          def show(n,d=0):
              if d>3 or not isinstance(n,dict): return
              print('  '*d, n.get('legislationIdentifier'), (n.get('legislationType') or {}).get('@id','') if isinstance(n.get('legislationType'),dict) else n.get('legislationType'), str((n.get('workExample') or {}) if isinstance(n.get('workExample'),dict) else n.get('workExample'))[:200])
              h=n.get('hasPart'); h=h if isinstance(h,list) else ([h] if h else [])
              for f in h[:4]: show(f,d+1)
          show(hp if isinstance(hp,dict) else {'hasPart':hp})
          PY
